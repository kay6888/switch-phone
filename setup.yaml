services:
  - type: web
    name: switch-phone
    runtime: node
    repo: https://github.com/kay6888/switch-phone
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    buildCommand: npm install
    startCommand: node server.js
